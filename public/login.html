<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso | Gestão Financeira Pro</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos específicos para Auth (extensão do style.css) */
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 20px;
      padding: 40px 35px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-header h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--text); }
    .auth-header p { color: var(--text-muted); font-size: 0.95rem; }

    /* Abas de alternância */
    .auth-tabs {
      display: flex;
      background: var(--bg-alt);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 25px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: all 0.3s ease;
      border: none;
      background: transparent;
    }

    .auth-tab.active {
      background: var(--card);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Formulários */
    .auth-form { display: none; flex-direction: column; gap: 16px; }
    .auth-form.active { display: flex; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { 
      font-size: 0.85rem; 
      font-weight: 600; 
      color: var(--text); 
      margin-left: 4px;
    }

    .auth-input {
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--bg-alt);
      color: var(--text);
      font-size: 1rem;
      transition: all 0.2s ease;
      width: 100%;
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--card);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      font-size: 1rem;
      border-radius: 12px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Toggle de senha */
    .password-wrapper { position: relative; }
    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0;
      min-width: auto;
      color: var(--text-muted);
    }
    .toggle-pass:hover { background: none; transform: translateY(-50%); }
  </style>
</head>
<body data-theme="light">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>💰 Finanças Pro</h1>
        <p>Gerencie seu dinheiro de forma inteligente</p>
      </div>

      <!-- Abas -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Entrar</button>
        <button class="auth-tab" data-tab="register">Criar Conta</button>
      </div>

      <!-- Formulário Login -->
      <form id="login-form" class="auth-form active">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" class="auth-input" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-pass">Senha</label>
          <div class="password-wrapper">
            <input type="password" id="login-pass" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-pass" data-target="login-pass">👁️</button>
          </div>
        </div>
        <button type="submit" class="auth-btn">Entrar</button>
      </form>

      <!-- Formulário Registro -->
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="reg-name">Nome completo</label>
          <input type="text" id="reg-name" class="auth-input" placeholder="João Silva" required minlength="2" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" class="auth-input" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="reg-pass">Senha</label>
          <div class="password-wrapper">
            <input type="password" id="reg-pass" class="auth-input" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
            <button type="button" class="toggle-pass" data-target="reg-pass">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirmar Senha</label>
          <input type="password" id="reg-confirm" class="auth-input" placeholder="Repita a senha" required autocomplete="new-password">
        </div>
        <button type="submit" class="auth-btn">Criar Conta Grátis</button>
      </form>

      <div class="auth-footer">
        <button id="theme-toggle-auth" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.85rem;">
          🌙 Alternar tema
        </button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="auth.js"></script>
</body>
</html>
