<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão Financeira</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>💰 Gestão Financeira Pessoal</h1>
  </header>

  <main>
    <section class="summary">
      <div class="card income"><h3>Receitas</h3><p id="total-income">R$ 0,00</p></div>
      <div class="card expense"><h3>Despesas</h3><p id="total-expense">R$ 0,00</p></div>
      <div class="card balance"><h3>Saldo</h3><p id="total-balance">R$ 0,00</p></div>
    </section>

    <section class="form-section">
      <h2>Nova Transação</h2>
      <form id="transaction-form">
        <input type="text" id="desc" placeholder="Descrição" required>
        <input type="number" id="amount" placeholder="Valor (ex: 150.00)" step="0.01" min="0.01" required>
        <select id="type" required>
          <option value="income">Receita</option>
          <option value="expense">Despesa</option>
        </select>
        <select id="category" required></select>
        <input type="date" id="date" required>
        <button type="submit">➕ Adicionar</button>
      </form>
    </section>

    <section class="table-section">
      <h2>Histórico</h2>
      <table>
        <thead>
          <tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Ação</th></tr>
        </thead>
        <tbody id="transactions-body"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
