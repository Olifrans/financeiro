<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de Gestão Financeira Pessoal">
  <title>💰 Gestão Financeira Pro</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
</head>
<body data-theme="light">

  <!-- 🔝 HEADER -->
  <header>
    <div class="header-content">
      <h1>💰 Gestão Financeira Pro</h1>
      <div class="header-actions">
        <select id="month-filter" aria-label="Filtro de mês">
          <option value="">Todos os meses</option>
          <option value="1">Janeiro</option>
          <option value="2">Fevereiro</option>
          <option value="3">Março</option>
          <option value="4">Abril</option>
          <option value="5">Maio</option>
          <option value="6">Junho</option>
          <option value="7">Julho</option>
          <option value="8">Agosto</option>
          <option value="9">Setembro</option>
          <option value="10">Outubro</option>
          <option value="11">Novembro</option>
          <option value="12">Dezembro</option>
        </select>

        <select id="year-filter" aria-label="Filtro de ano"></select>

        <button id="theme-toggle" title="Alternar tema" aria-label="Alternar tema">🌙</button>
        <button id="export-btn" title="Exportar CSV" aria-label="Exportar CSV">📥 CSV</button>
      </div>
    </div>
  </header>

  <!-- 📊 MAIN -->
  <main>

    <!-- Cards de Resumo -->
    <section class="summary" aria-label="Resumo financeiro">
      <div class="card income">
        <h3>💵 Receitas</h3>
        <p id="total-income">R$ 0,00</p>
      </div>
      <div class="card expense">
        <h3>💸 Despesas</h3>
        <p id="total-expense">R$ 0,00</p>
      </div>
      <div class="card balance">
        <h3>💰 Saldo</h3>
        <p id="total-balance">R$ 0,00</p>
      </div>
    </section>

    <!-- Gráficos -->
    <section class="charts-section" aria-label="Gráficos">
      <div class="chart-container">
        <h3>📊 Distribuição por Categoria</h3>
        <canvas id="categoryChart"></canvas>
      </div>
      <div class="chart-container">
        <h3>📈 Evolução Mensal</h3>
        <canvas id="monthlyChart"></canvas>
      </div>
    </section>

    <!-- Formulário -->
    <section class="form-section">
      <h2 id="form-title">➕ Nova Transação</h2>
      <form id="transaction-form" autocomplete="off">
        <input type="hidden" id="transaction-id">

        <input
          type="text"
          id="desc"
          placeholder="Descrição (ex: Supermercado)"
          maxlength="100"
          required
          aria-label="Descrição"
        >

        <input
          type="number"
          id="amount"
          placeholder="Valor (ex: 150.00)"
          step="0.01"
          min="0.01"
          required
          aria-label="Valor"
        >

        <select id="type" required aria-label="Tipo">
          <option value="income">💵 Receita</option>
          <option value="expense">💸 Despesa</option>
        </select>

        <select id="category" required aria-label="Categoria">
          <option value="">Selecione uma categoria</option>
        </select>

        <input type="date" id="date" required aria-label="Data">

        <div class="form-actions">
          <button type="submit" id="submit-btn">➕ Adicionar</button>
          <button type="button" id="cancel-btn" style="display:none;">❌ Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Tabela de Histórico -->
    <section class="table-section">
      <h2>📋 Histórico</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Valor</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="transactions-body">
            <tr>
              <td colspan="5" class="text-center text-muted">Carregando...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </section>

  </main>

  <!-- Toasts -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- App JS -->
  <script src="app.js" defer></script>
</body>
</html>
